<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Moja .me stránka</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        #cislo-display { 
            font-size: 10rem; 
            color: #007bff; 
        }
    </style>
</head>
<body>

    <div id="cislo-display">Načítavam...</div>

    <script>
        const url = "https://moj-projekt-4ec4a-default-rtdb.europe-west1.firebasedatabase.app/.json";

        function obnovCislo() {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.aktualne_cislo) {
                        document.getElementById('cislo-display').innerText = data.aktualne_cislo;
                    }
                })
                .catch(error => console.error('Chyba:', error));
        }

        setInterval(obnovCislo, 2000);
        obnovCislo();
    </script>
</body>
</html>
