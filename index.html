<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Kvetocraft</title>
	<link rel="icon" href="https://cdn-icons-png.flaticon.com/128/2926/2926754.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        *{
            box-sizing: border-box;
        }

        body { 
            font-family: 'VT323', monospace;
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            image-rendering: pixelated;

            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                              url('https://img.freepik.com/free-vector/hand-drawn-abstract-floral-background_23-2150744306.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        h1 {
            color: #55FF55;
            margin: 0;
            font-size: 5rem;
            text-shadow: 4px 4px #000000;
            letter-spacing: 2px;
        }
        
        .container, .graphs-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: #C6C6C6; 
            border: 4px solid #000000;
            border-top-color: #FFFFFF; 
            border-left-color: #FFFFFF;
            border-right-color: #555555; 
            border-bottom-color: #555555;
            padding: 25px;
            flex: 1;
            min-width: 200px; 
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4);
        }
        
        .card-label {
            color: #373737;
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }
        
        .card-value {
            font-size: 4rem;
            text-shadow: 3px 3px #222;
        }

        #temp-display { color: #AA0000; }     
        #humidity-display { color: #00AAAA; } 

        #timestamp { 
            color: #E5B700;
            font-size: 3rem;
            text-shadow: 2px 2px #000;
            display: block;
            margin-top: 5px;
            line-height: 1.1;
        }

        #sensor-status { color: #00AA00; }

        .card-unit {
            font-size: 2.5rem;
            color: #555555; 
            margin-left: 5px;
        }

        .graph-container {
            background: #C6C6C6; 
            border: 4px solid #000000;
            border-top-color: #FFFFFF; 
            border-left-color: #FFFFFF;
            border-right-color: #555555; 
            border-bottom-color: #555555;
            padding: 25px;
            flex: 1;
            min-width: 400px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4);
        }

        .graph-title {
            color: #373737;
            font-size: 2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        canvas {
            image-rendering: auto;
            max-height: 300px;
            width: 100% !important;
        }

    </style>
</head>
<body>

    <h1>MOJE KVETINKY ;)</h1>
    
    <div class="container">
        <div class="card">
            <span class="card-label">TEPLOTA</span>
            <span class="card-value" id="temp-display">-</span><span class="card-unit">°C</span>
        </div>
        
        <div class="card">
            <span class="card-label">VLHKOST</span>
            <span class="card-value" id="humidity-display">-</span><span class="card-unit">%</span>
        </div>
        
        <div class="card">
            <span class="card-label">CAS</span>
            <div id="timestamp">-</div>
        </div>
        
        <div class="card">
            <span class="card-label">STATUS</span>
            <span class="card-value" id="sensor-status">-</span>
        </div>
    </div>

    <div class="graphs-wrapper">
        <div class="graph-container">
            <div class="graph-title">TEPLOTA V CASE</div>
            <canvas id="tempChart"></canvas>
        </div>

        <div class="graph-container">
            <div class="graph-title">VLHKOST V CASE</div>
            <canvas id="humidityChart"></canvas>
        </div>
    </div>

    <script>
		const urlLatest = "https://moj-projekt-4ec4a-default-rtdb.europe-west1.firebasedatabase.app/sensors/latest.json";
		const urlGraphs = {
			temp: "https://moj-projekt-4ec4a-default-rtdb.europe-west1.firebasedatabase.app/sensors/graph.json",
			humidity: "https://moj-projekt-4ec4a-default-rtdb.europe-west1.firebasedatabase.app/sensors/graph_air.json"
		};
		
		let charts = {};

		function obnovUdaje() {
			fetch(urlLatest)
				.then(response => response.json())
				.then(data => {

					if (data) {
						if (data.air_temp_c !== undefined) document.getElementById('temp-display').innerText = data.air_temp_c;
						if (data.air_humidity_percent !== undefined) document.getElementById('humidity-display').innerText = data.air_humidity_percent;
						if (data.timestamp !== undefined) document.getElementById('timestamp').innerText = data.timestamp;

						const statusEl = document.getElementById('sensor-status');
						if (skontrolujCas(data.timestamp)) {
							statusEl.innerText = 'OK';
							statusEl.style.color = '#00AA00';
						} else {
							statusEl.innerText = 'NOK';
							statusEl.style.color = '#AA0000';
						}
					}
				})
				.catch(error => console.error('CHYBA PRI SŤAHOVANÍ:', error));
		}

		function skontrolujCas(ts) {
			if (!ts) return false;
			try {
				const castaMien = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
				
				const parts = ts.split(' ');
				const datePart = parts[0].split('.');
				const timePart = parts[1].split(':');

				const den = parseInt(datePart[0]);
				const mesiac = datePart[1].toLowerCase();
				const mesiacIndex = castaMien.indexOf(mesiac);
				const hodina = parseInt(timePart[0]);
				const minuta = parseInt(timePart[1]);

				const teraz = new Date();
				const poslednyUpdate = new Date(teraz.getFullYear(), mesiacIndex, den, hodina, minuta);
				
				const rozdielMinut = Math.abs(teraz - poslednyUpdate) / (1000 * 60);
				console.log("Rozdiel v minútach:", rozdielMinut);
				
				return rozdielMinut <= 30; 
			} catch(e) {
				return false;
			}
		}

		function obnovGraf(typ, url, chartId, label, borderColor) {
			fetch(url)
				.then(response => response.json())
				.then(data => {
					if(!data) return;
					const labels = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));
					const values = labels.map(key => data[key]);
					const ctx = document.getElementById(chartId).getContext('2d');
					
					if (charts[typ]) {
						charts[typ].data.labels = labels;
						charts[typ].data.datasets[0].data = values;
						charts[typ].update();
					} else {
						charts[typ] = new Chart(ctx, {
							type: 'line',
							data: {
								labels: labels,
								datasets: [{
									label: label,
									data: values,
									borderColor: borderColor,
									backgroundColor: `${borderColor}30`,
									fill: true,
									tension: 0.3
								}]
							},
							options: { responsive: true, maintainAspectRatio: false }
						});
					}
				});
		}

		obnovUdaje();
		obnovGraf('temp', urlGraphs.temp, 'tempChart', 'Teplota', '#AA0000');
		obnovGraf('humidity', urlGraphs.humidity, 'humidityChart', 'Vlhkosť', '#00AAAA');

		setInterval(obnovUdaje, 5000000);
		setInterval(() => {
			obnovGraf('temp', urlGraphs.temp, 'tempChart', 'Teplota', '#AA0000');
			obnovGraf('humidity', urlGraphs.humidity, 'humidityChart', 'Vlhkosť', '#00AAAA');
		}, 3000000000);
	</script>
</body>
</html>
