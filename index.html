<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>KVETOCRAFT</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { 
            font-family: 'VT323', monospace;
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 20px;
            image-rendering: pixelated;

            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                              url('https://img.freepik.com/free-vector/hand-drawn-abstract-floral-background_23-2150744306.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        h1 {
            color: #55FF55;
            margin: 0;
            font-size: 5rem;
            text-shadow: 4px 4px #000000;
            letter-spacing: 2px;
        }
        
        .container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .card {
            background: #C6C6C6; 
            border: 4px solid #000000;
            border-top-color: #FFFFFF; 
            border-left-color: #FFFFFF;
            border-right-color: #555555; 
            border-bottom-color: #555555;
            padding: 25px;
            width: 220px;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4);
        }
        
        .card-label {
            color: #373737;
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: block;
        }
        
        .card-value {
            font-size: 4rem;
            text-shadow: 3px 3px #222;
        }

        #temp-display { 
            color: #AA0000;
        }     
        
        #humidity-display { 
            color: #00AAAA;
        } 

        #timestamp { 
            color: #E5B700;
            font-size: 3rem;
            text-shadow: 2px 2px #000;
            display: block;
            margin-top: 5px;
            line-height: 1.1;
        }

        #sensor-status { 
            color: #00AA00;
        }

        .card-unit {
            font-size: 2.5rem;
            color: #555555; 
            margin-left: 5px;
        }

        .graph-container {
            background: #C6C6C6; 
            border: 4px solid #000000;
            border-top-color: #FFFFFF; 
            border-left-color: #FFFFFF;
            border-right-color: #555555; 
            border-bottom-color: #555555;
            padding: 25px;
            width: 90%;
            max-width: 800px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4);
        }

        .graph-title {
            color: #373737;
            font-size: 2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        canvas {
            image-rendering: pixelated;
        }

    </style>
</head>
<body>

    <h1>MOJE KVETINKY ;)</h1>
    
    <div class="container">
        <div class="card">
            <span class="card-label">TEPLOTA</span>
            <span class="card-value" id="temp-display">-</span><span class="card-unit">°C</span>
        </div>
        
        <div class="card">
            <span class="card-label">VLHKOST</span>
            <span class="card-value" id="humidity-display">-</span><span class="card-unit">%</span>
        </div>
        
        <div class="card">
            <span class="card-label">CAS</span>
            <div id="timestamp">-</div>
        </div>
        
        <div class="card">
            <span class="card-label">STATUS</span>
            <span class="card-value" id="sensor-status">-</span>
        </div>
    </div>

    <div class="graph-container">
        <div class="graph-title">TEPLOTA V CASE</div>
        <canvas id="tempChart"></canvas>
    </div>

    <script>
        const urlLatest = "https://moj-projekt-4ec4a-default-rtdb.europe-west1.firebasedatabase.app/sensors/latest.json";
        const urlGraph = "https://moj-projekt-4ec4a-default-rtdb.europe-west1.firebasedatabase.app/sensors/graph.json";
        
        let chart = null;

        function obnovUdaje() {
            fetch(urlLatest)
                .then(response => response.json())
                .then(data => {
                    if (data.air_temp_c !== undefined) {
                        document.getElementById('temp-display').innerText = data.air_temp_c;
                    }
                    if (data.air_humidity_percent !== undefined) {
                        document.getElementById('humidity-display').innerText = data.air_humidity_percent;
                    }
                    if (data.timestamp !== undefined) {
                        document.getElementById('timestamp').innerText = data.timestamp;
                    }
                    
                    const statusEl = document.getElementById('sensor-status');
                    if (data.dht_ok === true) {
                        statusEl.innerText = 'OK';
                        statusEl.style.color = '#55FF55';
                    } else {
                        statusEl.innerText = 'NOK';
                        statusEl.style.color = '#FF5555';
                    }
                })
                .catch(error => console.error('Chyba:', error));
        }

        function obnovGraf() {
            fetch(urlGraph)
                .then(response => response.json())
                .then(data => {
                    const labels = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));
                    const values = labels.map(key => data[key]);
                    
                    const ctx = document.getElementById('tempChart').getContext('2d');
                    
                    if (chart) {
                        chart.data.labels = labels;
                        chart.data.datasets[0].data = values;
                        chart.update();
                    } else {
                        chart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: 'Teplota kvietkov',
                                    data: values,
                                    borderColor: '#AA0000',
                                    backgroundColor: 'rgba(170, 0, 0, 0.1)',
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.1,
                                    pointRadius: 4,
                                    pointBackgroundColor: '#AA0000',
                                    pointBorderColor: '#000000',
                                    pointBorderWidth: 2,
                                    pointHoverRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: {
                                    legend: {
                                        labels: {
                                            font: {
                                                family: "'VT323', monospace",
                                                size: 16
                                            },
                                            color: '#373737'
                                        }
                                    }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: false,
                                        ticks: {
                                            font: {
                                                family: "'VT323', monospace",
                                                size: 14
                                            },
                                            color: '#373737'
                                        },
                                        grid: {
                                            color: '#AAAAAA',
                                            lineWidth: 2
                                        }
                                    },
                                    x: {
                                        ticks: {
                                            font: {
                                                family: "'VT323', monospace",
                                                size: 14
                                            },
                                            color: '#373737'
                                        },
                                        grid: {
                                            color: '#AAAAAA',
                                            lineWidth: 2
                                        }
                                    }
                                }
                            }
                        });
                    }
                })
                .catch(error => console.error('Chyba pri grafe:', error));
        }

        setInterval(obnovUdaje, 2000000); 
        setInterval(obnovGraf, 2000000);
        obnovUdaje();
        obnovGraf();
    </script>
</body>
</html>
